                            </div>

                            <div style={gap(2.5)}>
                                {data.experience.map(exp => (
                                    <div key={exp.id} className="grid grid-cols-[1fr_3fr] gap-6 print-break-avoid">
                                        <div className="text-right pt-1">
                                            <div className="font-bold text-slate-900">{exp.company}</div>
                                            <div className="text-xs text-gray-400 uppercase tracking-widest mt-1">{exp.date}</div>
                                            <div className="text-xs text-gray-400 mt-0.5">{exp.location}</div>
                                        </div>
                                        <div className="border-l border-gray-100 pl-6 relative">
                                            <div className="absolute -left-[3px] top-2 w-1.5 h-1.5 rounded-full bg-slate-300" style={{ backgroundColor: data.design?.color }}></div>
                                            <h3 className="text-[1.125em] font-serif italic font-medium mb-2">{exp.role}</h3>
                                            <TextWithBullets text={exp.description} className="text-slate-600 leading-relaxed text-[0.9em]" />
                                            {data.design?.showTechnologies !== false && exp.technologies && (
                                                <div className="text-[0.8em] text-slate-500 mt-3 font-mono">
                                                    <span className="font-bold mr-2 text-slate-400">{t.labels.technologies}:</span>
                                                    {exp.technologies}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    );
                    case 'education': return data.education.length > 0 && (
                        <div key="education" style={{ marginBottom: `${2 * sectionSpacing}rem` }}>
                            <h2 className="text-[1.25em] font-serif italic text-center mb-6" style={{ color: data.design?.color }}>{t.education}</h2>
                            <div style={gap(1.5)}>
                                {data.education.map(edu => (
                                    <div key={edu.id} className="text-center print-break-avoid">
                                        <div className="font-bold text-slate-800">{edu.school}</div>
                                        <div className="text-[0.9em] italic text-gray-600">{edu.degree}</div>
                                        <div className="text-xs text-gray-400 mt-1 mb-2">{edu.date}</div>
                                        {edu.description && <TextWithBullets text={edu.description} className="text-sm text-gray-500 italic leading-relaxed text-left inline-block" />}
                                    </div>
                                ))}
                            </div>
                        </div>
                    );
                    case 'skills': return data.skills.length > 0 && (
                        <div key="skills" style={{ marginBottom: `${2.5 * sectionSpacing}rem` }}>
                            <h2 className="text-[1.25em] font-serif italic text-center mb-6" style={{ color: data.design?.color }}>{t.skills}</h2>
                            <div className="text-center" style={gap(1)}>
                                {data.skills.map(skill => (
                                    skill.name ? (
                                        <div key={skill.id} className="print-break-avoid">
                                            <div className="text-[0.8em] font-bold uppercase tracking-widest text-gray-400 mb-1">{skill.name}</div>
                                            <div className="text-[0.9em] text-slate-700">{skill.items}</div>
                                        </div>
                                    ) : null
                                ))}
                            </div>
                        </div>
                    );
                    case 'languages': return data.languages?.length > 0 && (
                        <div key="languages" style={{ marginBottom: `${2.5 * sectionSpacing}rem` }}>
                            <h2 className="text-[1.25em] font-serif italic text-center mb-6" style={{ color: data.design?.color }}>{t.languages}</h2>
                            <div className="text-center" style={gap(0.5)}>
                                {data.languages.map(lang => (
                                    lang.language ? (
                                        <div key={lang.id} className="mb-3 print-break-avoid">
                                            <span className="font-bold uppercase tracking-wide text-[0.8em] text-slate-500">{lang.language}</span>
                                            <span className="block text-[0.9em] italic text-gray-400 mt-0.5">{lang.proficiency}</span>
                                        </div>
                                    ) : null
                                ))}
                            </div>
                        </div>
                    );
                    case 'projects': return data.projects.length > 0 && data.design?.showProjects !== false && (
                        <div key="projects" className="border-t border-gray-100" style={{ marginTop: `${3 * sectionSpacing}rem`, paddingTop: `${2.5 * sectionSpacing}rem`, borderColor: data.design?.color ? data.design.color + '40' : undefined }}>
                            <h2 className="text-[1.25em] font-serif italic text-center mb-6" style={{ color: data.design?.color }}>{t.projects}</h2>
                            <div className="grid grid-cols-1 max-w-3xl mx-auto" style={{ gap: `${1.5 * spacing}rem` }}>
                                {data.projects.map(proj => (
                                    <div key={proj.id} className="text-center print-break-avoid">
                                        <div className="font-bold text-slate-800 mb-1">
                                            {proj.name}
                                            {proj.link && <span className="font-normal text-gray-400 text-xs ml-2 font-sans tracking-tight">{proj.link}</span>}
                                        </div>
                                        <TextWithBullets text={proj.description} className="text-[0.9em] text-slate-600" />
                                    </div>
                                ))}
                            </div>
                        </div>
                    );
                    default: return null;
                }
            }

            return (
                <div style={{
                    fontFamily: "'Playfair Display', serif",
                    fontSize: (data.design?.bodySize || 12) + 'px',
                    lineHeight: data.design?.lineHeight || 1.5,
                    '--heading-size': (data.design?.headingSize || 18) + 'px',
                    '--subheading-size': (data.design?.subheadingSize || 14) + 'px',
                    '--body-size': (data.design?.bodySize || 12) + 'px',
                    '--line-height': data.design?.lineHeight || 1.5
                }}>
                    {layout.map((page, i) => (
                        <div key={page.id} className="sheet bg-white w-[210mm] min-h-[297mm] p-[15mm] print:p-[15mm] relative shadow-2xl print:shadow-none mb-8 print:mb-0 print:break-before-page overflow-hidden">
                            {/* Header (Page 1 Only) */}
                            {i === 0 && <ResumeHeader data={data} t={t} theme="elegant" />}
                            <div className="font-sans">
                                {page.sections.map(section => renderSection(section))}
                            </div>

                            {/* Fin Marker (Last Page) */}
                            {i === layout.length - 1 && (
                                <div className="mt-16 text-center">
                                    <div className="w-8 h-8 mx-auto border border-gray-300 rounded-full flex items-center justify-center" style={{ borderColor: data.design?.color, color: data.design?.color }}>
                                        <span className="text-xs font-serif italic">fin</span>
                                    </div>
                                </div>
                            )}

                            {/* Visual Page Boundary Indicators */}
                            <div className="page-boundary-indicator"></div>
                            <div className="content-overflow-warning">⚠️ Overflow Alert</div>
                        </div>
                    ))}
                </div>
            );
        };

        // --- 主App ---
        const App = () => {
            // Load state from localStorage or use defaults
            const loadState = (key, defaultVal) => {
                try {
                    const saved = localStorage.getItem(key);
                    return saved ? JSON.parse(saved) : defaultVal;
                } catch (e) {
                    console.error("Load failed", e);
                    return defaultVal;
                }
            };

            const saveState = (key, value) => {
                try {
                    localStorage.setItem(key, JSON.stringify(value));
                } catch (e) {
                    console.error("Save failed", e);
                    alert("Failed to save data to local storage properly");
                }
            };

            const [lang, setLang] = useState(() => loadState('resume_lang', 'en'));
            const [theme, setTheme] = useState(() => loadState('resume_theme', 'classic'));
            const defaultLayout = [
                { id: 'p1', sections: ['summary', 'experience', 'education', 'projects', 'skills', 'languages'] }
            ];

            const normalizeSinglePageDesign = (value = {}) => {
                const pages = Array.isArray(value.layout) && value.layout.length ? value.layout : defaultLayout;
                const requiredSections = ['summary', 'experience', 'education', 'projects', 'skills', 'languages'];
                const sections = [...new Set([
                    ...pages.flatMap(page => Array.isArray(page.sections) ? page.sections : []),
                    ...requiredSections
                ])];
                return {
                    ...value,
                    singleColumnRatio: value.singleColumnRatio ?? 31,
                    singleDensity: value.singleDensity || 'balanced',
                    paperTone: value.paperTone || 'white',
                    pageMargin: value.pageMargin ?? 13,
                    sectionHeadingStyle: value.sectionHeadingStyle || 'line',
                    showAvatar: value.showAvatar !== false,
                    hiddenSections: value.hiddenSections || {},
                    layout: [{ id: 'p1', sections: sections.length ? sections : defaultLayout[0].sections }]
                };
            };

            const [design, setDesign] = useState(() => normalizeSinglePageDesign(loadState('resume_design', {
                font: 'default',
                color: '#3b82f6',
                logo: '',
                logoPosition: 'header-right',
                logoSize: 48,
                logoOpacity: 80,
                logoCoords: null, // { x: number, y: number } in percent or px, let's use percent for responsiveness or mm? Px relative to A4 (794x1123) is easiest.
                showPageNumbers: true,
                pageNumberPosition: 'bottom-right',
                spacing: 1,
                fontSize: 15,
                lineHeight: 1.5,
                headerLayout: 'split',
                headerStyle: 'clean',
                avatarShape: 'rounded',
                layout: defaultLayout,
                sectionPositions: {
                    skills: 'sidebar',
                    education: 'sidebar',
                    languages: 'sidebar',
                    contact: 'sidebar',
                    summary: 'main',
                    experience: 'main',
                    projects: 'main'
                }
            })));

            const [editorSpacing, setEditorSpacing] = useState(() => loadState('resume_editor_spacing', 1.0));

            // Migration: collapse any legacy multi-page layout into one A4 page.
            useEffect(() => {
                const normalized = normalizeSinglePageDesign(design);
                if (JSON.stringify(normalized.layout) !== JSON.stringify(design.layout)) setDesign(normalized);
            }, []);

            useEffect(() => {
                const migrationKey = 'resume_single_page_templates_v2';
                if (!localStorage.getItem(migrationKey)) {
                    setTheme('swiss');
                    setDesign(p => normalizeSinglePageDesign({
                        ...p,
                        font: 'sans',
                        color: '#ef3b2d',
                        singleDensity: 'roomy',
                        singleColumnRatio: 29,
                        paperTone: 'white'
                    }));
                    localStorage.setItem(migrationKey, '1');
                }
            }, []);

            const [resume, setResume] = useState(() => {
                const data = loadState('resume_data_v1', initialData);
                if (!data.languages) data.languages = [];
                return data;
            });
            const [isSaved, setIsSaved] = useState(true);
            const [activeTab, setActiveTab] = useState('design');

            // --- Resizable Sidebar Logic ---
            const [sidebarWidth, setSidebarWidth] = useState(() => loadState('resume_ui_width', 480));
            const [isResizing, setIsResizing] = useState(false);

            useEffect(() => {
                localStorage.setItem('resume_ui_width', JSON.stringify(sidebarWidth));
            }, [sidebarWidth]);

            const startResizing = (e) => {
                e.preventDefault();
                setIsResizing(true);
            };

            const stopResizing = () => {
                setIsResizing(false);
            };

            const resize = (e) => {
                if (isResizing) {
                    const newWidth = e.clientX;
                    // Extended width limit as requested
                    if (newWidth > 300 && newWidth < 1400) {
                        setSidebarWidth(newWidth);
                    }
                }
            };

            useEffect(() => {
                if (isResizing) {
                    window.addEventListener('mousemove', resize);
                    window.addEventListener('mouseup', stopResizing);
                } else {
                    window.removeEventListener('mousemove', resize);
                    window.removeEventListener('mouseup', stopResizing);
                }
                return () => {
                    window.removeEventListener('mousemove', resize);
                    window.removeEventListener('mouseup', stopResizing);
                };
            }, [isResizing]);

            // Inject a normalized single-page design into resume data.
            const singlePageDesign = normalizeSinglePageDesign(design);
            const resumeWithDesign = { ...resume, design: singlePageDesign };

            // Auto-Save Effects
            useEffect(() => {
                localStorage.setItem('resume_lang', JSON.stringify(lang));
            }, [lang]);

            useEffect(() => {
                localStorage.setItem('resume_theme', JSON.stringify(theme));
            }, [theme]);

            useEffect(() => {
                localStorage.setItem('resume_design', JSON.stringify(design));
            }, [design]);

            useEffect(() => {
                localStorage.setItem('resume_editor_spacing', JSON.stringify(editorSpacing));
            }, [editorSpacing]);

            useEffect(() => {
                setIsSaved(false);
                const timer = setTimeout(() => {
                    localStorage.setItem('resume_data_v1', JSON.stringify(resume));
                    setIsSaved(true);
                }, 1000);
                return () => clearTimeout(timer);
            }, [resume]);

            const t = uiText[lang];
            const singlePageThemes = ['classic', 'modern', 'minimal', 'professional', 'elegant', 'swiss', 'splitCompact', 'monoLedger'];
            const A4_WIDTH_PX = 794;
            const A4_HEIGHT_PX = 1123;

            // --- Hooks and Refs ---
            const containerRef = useRef(null);
            const [pageUsage, setPageUsage] = useState(0);
            const [pageOverflow, setPageOverflow] = useState(false);
            const [previewScale, setPreviewScale] = useState(1);

            useLayoutEffect(() => {
                const updatePreviewScale = () => {
                    const availableWidth = window.innerWidth >= 1280
                        ? window.innerWidth - sidebarWidth - 88
                        : window.innerWidth - 80;
                    const availableHeight = window.innerHeight >= 760
                        ? window.innerHeight - 64
                        : window.innerHeight - 40;
                    const next = Math.max(0.34, Math.min(1, availableWidth / A4_WIDTH_PX, availableHeight / A4_HEIGHT_PX));
                    setPreviewScale(Math.round(next * 1000) / 1000);
                };
                updatePreviewScale();
                window.addEventListener('resize', updatePreviewScale);
                return () => window.removeEventListener('resize', updatePreviewScale);
            }, [sidebarWidth]);

            useLayoutEffect(() => {
                const host = containerRef.current;
                if (!host) return;

                const measure = () => {
                    const sheet = host.querySelector('.sheet');
                    if (!sheet) return;
                    const content = sheet.querySelector('[data-page-content]');
                    let contentHeight = 0;

                    if (content) {
                        const sheetRect = sheet.getBoundingClientRect();
                        const renderScale = sheetRect.height ? sheet.clientHeight / sheetRect.height : 1;
                        const meaningfulNodes = [...content.querySelectorAll('header, section, article')]
                            .filter(node => window.getComputedStyle(node).position !== 'absolute');
                        meaningfulNodes.forEach(node => {
                            const rect = node.getBoundingClientRect();
                            contentHeight = Math.max(contentHeight, (rect.bottom - sheetRect.top) * renderScale + 28);
                        });
                        if (!meaningfulNodes.length) contentHeight = content.scrollHeight;
                    } else {
                        const sheetRect = sheet.getBoundingClientRect();
                        const renderScale = sheetRect.height ? sheet.clientHeight / sheetRect.height : 1;
                        [...sheet.children]
                            .filter(node => !node.classList?.contains('page-boundary-indicator') && !node.classList?.contains('content-overflow-warning'))
                            .forEach(node => {
                                const rect = node.getBoundingClientRect();
                                contentHeight = Math.max(contentHeight, (rect.bottom - sheetRect.top) * renderScale);
                            });
                    }

                    const sheetHeight = sheet.clientHeight || A4_HEIGHT_PX;
                    const rawUsage = sheetHeight ? Math.ceil((contentHeight / sheetHeight) * 100) : 0;
                    const overflow = rawUsage > 100 || sheet.scrollHeight > sheetHeight + 2;
                    setPageUsage(Math.max(1, Math.min(rawUsage, 199)));
                    setPageOverflow(overflow);
                    sheet.classList.toggle('is-overflowing', overflow);
                };

                const observer = new ResizeObserver(measure);
                observer.observe(host);
                const sheet = host.querySelector('.sheet');
                if (sheet) observer.observe(sheet);
                const timer = window.setTimeout(measure, 80);
                window.addEventListener('resize', measure);
                return () => {
                    observer.disconnect();
                    window.clearTimeout(timer);
                    window.removeEventListener('resize', measure);
                };
            }, [resume, design, theme, lang]);

            // Handlers
            const handlePersonalChange = (e) => {
                const { name, value } = e.target;
                setResume(prev => ({ ...prev, personal: { ...prev.personal, [name]: value } }));
            };

            const handleAvatarUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    if (file.size > 2 * 1024 * 1024) {
                        alert(lang === 'zh' ? '图片过大，建议上传小于2MB的图片以保证流畅性。' : 'Image too large. Recommended < 2MB.');
                    }
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setResume(prev => ({ ...prev, personal: { ...prev.personal, avatar: reader.result } }));
                    };
                    reader.readAsDataURL(file);
                }
            };

            const removeAvatar = () => {
                setResume(prev => ({ ...prev, personal: { ...prev.personal, avatar: '' } }));
            };

            const handleLogoUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    if (file.size > 1 * 1024 * 1024) {
                        alert(lang === 'zh' ? 'Logo 图片过大，建议小于 1MB。' : 'Logo too large. Recommended < 1MB.');
                    }
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setDesign(prev => ({ ...prev, logo: reader.result }));
                    };
                    reader.readAsDataURL(file);
                }
            };

            const removeLogo = () => {
                setDesign(prev => ({ ...prev, logo: '' }));
            };

            // Load Example (User Custom or Built-in)
            const loadExample = () => {
                const userExample = loadState('resume_user_example', null);
                if (userExample) {
                    if (userExample.resume) setResume(userExample.resume);
                    if (userExample.design) setDesign(userExample.design);
                    if (userExample.theme) setTheme(userExample.theme);
                    if (userExample.lang) setLang(userExample.lang);
                } else {
                    setResume(lang === 'zh' ? exampleDataZh : exampleDataEn);
                }
            };

            // Save as Example (Overrides built-in example for this user)
            const saveAsExample = () => {
                const dataToSave = {
                    resume,
                    design,
                    theme,
                    lang
                };
                saveState('resume_user_example', dataToSave);
                alert(t.exampleSaved);
            };

            const reset = () => {
                if (confirm(t.reset + "?")) setResume(initialData);
            };

            const printPDF = () => {
                window.print();
            };

            // Export template as JSON file
            const exportTemplate = () => {
                const templateData = {
                    version: '1.0',
                    exportDate: new Date().toISOString(),
                    resume: resume,
                    design: design,
                    theme: theme
                };
                const blob = new Blob([JSON.stringify(templateData, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `resume_template_${resume.personal.fullName?.replace(/\s+/g, '_') || 'untitled'}_${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            // Import template from JSON file
            const importTemplate = (event) => {
                const file = event.target.files?.[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const templateData = JSON.parse(e.target.result);
                        if (templateData.resume) {
                            setResume(templateData.resume);
                        }
                        if (templateData.design) {
                            setDesign(normalizeSinglePageDesign(templateData.design));
                        }
                        if (templateData.theme) {
                            setTheme(templateData.theme);
                        }
                        alert(lang === 'zh' ? '模板导入成功！' : 'Template imported successfully!');
                    } catch (err) {
                        alert(lang === 'zh' ? '导入失败：无效的模板文件' : 'Import failed: Invalid template file');
                        console.error('Import error:', err);
                    }
                };
                reader.readAsText(file);
                // Reset input value to allow re-importing same file
                event.target.value = '';
            };

            const addToList = (listName, emptyItem) => {
                setResume(prev => ({
                    ...prev,
                    [listName]: [...prev[listName], { ...emptyItem, id: Date.now() }]
                }));
            };

            const removeFromList = (listName, id) => {
                setResume(prev => ({
                    ...prev,
                    [listName]: prev[listName].filter(item => item.id !== id)
                }));
            };

            const updateListItem = (listName, id, field, value) => {
                setResume(prev => ({
                    ...prev,
                    [listName]: prev[listName].map(item => item.id === id ? { ...item, [field]: value } : item)
                }));
            };

            const moveListItem = (listName, index, direction) => {
                setResume(prev => {
                    const list = [...prev[listName]];
                    const targetIndex = index + direction;
                    if (targetIndex < 0 || targetIndex >= list.length) return prev;
                    [list[index], list[targetIndex]] = [list[targetIndex], list[index]];
                    return { ...prev, [listName]: list };
                });
            };

            // Single-page layout handler: sections can be reordered, never moved to another page.
            const moveSection = (pageIndex, sectionIndex, direction) => {
                setDesign(prev => {
                    const normalized = normalizeSinglePageDesign(prev);
                    const newLayout = JSON.parse(JSON.stringify(normalized.layout));
                    const page = newLayout[0];
                    const targetIndex = sectionIndex + direction;
                    if (targetIndex >= 0 && targetIndex < page.sections.length) {
                        [page.sections[sectionIndex], page.sections[targetIndex]] = [page.sections[targetIndex], page.sections[sectionIndex]];
                        return { ...normalized, layout: newLayout };
                    }
                    return prev;
                });
            };


            const toggleSectionPosition = (sectionId) => {
                setDesign(prev => {
                    const currentPos = prev.sectionPositions?.[sectionId] || 'main'; // Default fallback
                    const newPos = currentPos === 'sidebar' ? 'main' : 'sidebar';
                    return {
                        ...prev,
                        sectionPositions: {
                            ...prev.sectionPositions,
                            [sectionId]: newPos
                        }
                    };
                });
            };

            const toggleSectionVisibility = (sectionId) => {
                setDesign(prev => ({
                    ...prev,
                    hiddenSections: {
                        ...(prev.hiddenSections || {}),
                        [sectionId]: !prev.hiddenSections?.[sectionId]
                    }
                }));
            };

            const autoFitSinglePage = () => {
                setDesign(prev => {
                    const nextDensity = pageOverflow || pageUsage > 94
                        ? 'compact'
                        : pageUsage < 72
                            ? 'roomy'
                            : 'balanced';
                    return {
                        ...prev,
                        singleDensity: nextDensity,
                        pageMargin: pageOverflow ? Math.max(8, (prev.pageMargin || 13) - 2) : (prev.pageMargin || 13)
                    };
                });
            };

            const moveSectionToColumn = (sectionId, targetColumn) => {
                if (!sectionId || !targetColumn) return;
                setDesign(prev => ({
                    ...prev,
                    sectionPositions: {
                        ...prev.sectionPositions,
                        [sectionId]: targetColumn
                    }
                }));
            };

            // Draggable Logo Handler
            const updateLogoCoords = (coords) => {
                setDesign(prev => ({ ...prev, logoCoords: coords }));
            };

            // Font selection based on Lang
            const getFont = () => {
                if (design.font && design.font !== 'default') {
                    if (design.font === 'sans') return "'Inter', sans-serif";
                    if (design.font === 'serif') return "'EB Garamond', serif";
                    if (design.font === 'mono') return "'Fira Code', monospace";
                    if (design.font === 'oswald') return "'Oswald', sans-serif";
                    if (design.font === 'lato') return "'Lato', sans-serif";
                }
                if (theme === 'professional') return "'Roboto', sans-serif";
                if (theme === 'elegant') return "'Playfair Display', serif";
                if (theme === 'swiss' || theme === 'splitCompact') return "'Inter', sans-serif";
                if (theme === 'monoLedger') return "'EB Garamond', serif";
                if (lang === 'zh') return "'Noto Sans SC', sans-serif";
                if (theme === 'classic') return "'EB Garamond', serif";
                if (theme === 'minimal') return "'Inter', sans-serif";
                return "'Roboto', sans-serif"; // modern and default
            };

            const fontStyle = getFont();

            // Spacing Helper
            const s = (baseRem) => ({ marginBottom: `${baseRem * (design.spacing || 1)}rem` });
            const gap = (baseRem) => ({ gap: `${baseRem * (design.spacing || 1)}rem`, display: 'flex', flexDirection: 'column' });

            // Theme Renderer
            const renderTheme = () => {
                const props = { data: resumeWithDesign, t, fontStyle, onDrag: updateLogoCoords, onMoveSection: moveSectionToColumn };
                switch (theme) {
                    case 'classic': return <ThemeSinglePage {...props} variant="classicRefresh" />;
                    case 'modern': return <ThemeSinglePage {...props} variant="splitCompact" />;
                    case 'minimal': return <ThemeSinglePage {...props} variant="minimalRefresh" />;
                    case 'professional': return <ThemeSinglePage {...props} variant="executiveRefresh" />;
                    case 'elegant': return <ThemeSinglePage {...props} variant="softEditorialRefresh" />;
                    case 'swiss': return <ThemeSinglePage {...props} variant="swiss" />;
                    case 'splitCompact': return <ThemeSinglePage {...props} variant="splitCompact" />;
                    case 'monoLedger': return <ThemeSinglePage {...props} variant="monoLedger" />;
                    default: return <ThemeSinglePage {...props} variant="classicRefresh" />;
                }
            };
            return (
                <div className="min-h-screen flex flex-col xl:flex-row bg-gray-50">
                    {/* Left: Editor Sidebar */}
                    <div
                        style={{ '--sidebar-width': `${sidebarWidth}px` }}
                        className="bg-gray-50 border-r border-gray-200 w-full xl:w-[var(--sidebar-width)] h-auto xl:h-screen xl:sticky xl:top-0 xl:overflow-y-auto shrink-0 print:hidden z-10 relative group"
                    >
                        {/* Drag Handle */}
                        <div
                            className="hidden xl:block absolute top-0 right-0 w-1.5 h-full cursor-ew-resize hover:bg-blue-400 z-50 transition-colors opacity-0 group-hover:opacity-100 bg-transparent"
                            onMouseDown={startResizing}
                            title="Drag to resize"
                        ></div>
                        <header className="bg-white border-b border-gray-200 sticky top-0 z-10 shadow-sm">
                            <div className="p-4 flex flex-wrap justify-between items-center gap-2 border-b border-gray-100">
                                <h1 className="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-indigo-600 flex items-center gap-2">
                                    <FileTextIcon className="text-blue-600" /> {t.title}
                                </h1>
                                <div className="flex gap-1 sm:gap-2 items-center">
                                    <span className={`text-xs font-medium transition-colors ${isSaved ? 'text-green-500' : 'text-orange-400'}`}>
                                        {isSaved ? (lang === 'zh' ? '已保存' : 'Saved') : (lang === 'zh' ? '保存中...' : 'Saving...')}
                                    </span>
                                    <div className="w-px h-4 bg-gray-300 mx-1"></div>
                                    <button onClick={saveAsExample} className="text-purple-600 p-2 hover:bg-purple-50 rounded" title={t.saveAsExample}>
                                        <BookmarkIcon />
                                    </button>

                                    <button onClick={loadExample} className="text-blue-600 p-2 hover:bg-blue-50 rounded" title={t.example}>
                                        <Wand2Icon />
                                    </button>
                                    <button onClick={reset} className="text-red-500 p-2 hover:bg-red-50 rounded" title={t.reset}>
                                        <RotateCcwIcon />
                                    </button>

                                    <div className="w-px h-4 bg-gray-300 mx-1"></div>
                                    <button onClick={exportTemplate} className="text-emerald-600 p-2 hover:bg-emerald-50 rounded" title={lang === 'zh' ? '导出模板' : 'Export Template'}>
                                        <DownloadIcon />
                                    </button>
                                    <label className="text-amber-600 p-2 hover:bg-amber-50 rounded cursor-pointer" title={lang === 'zh' ? '导入模板' : 'Import Template'}>
                                        <UploadIcon />
                                        <input
                                            type="file"
                                            accept=".json"
                                            onChange={importTemplate}
                                            className="hidden"
                                        />
                                    </label>


                                </div>
                            </div>
                            {/* Tabs */}
                            <div className="flex">
                                <button
                                    onClick={() => setActiveTab('content')}
                                    className={`flex-1 py-3 text-sm font-bold flex items-center justify-center gap-2 transition-colors ${activeTab === 'content' ? 'text-blue-600 border-b-2 border-blue-600 bg-blue-50/50' : 'text-gray-500 hover:bg-gray-50'}`}
                                >
                                    <FileTextIcon className="w-4 h-4" /> {t.contentTab}
                                </button>
                                <button
                                    onClick={() => setActiveTab('design')}
                                    className={`flex-1 py-3 text-sm font-bold flex items-center justify-center gap-2 transition-colors ${activeTab === 'design' ? 'text-blue-600 border-b-2 border-blue-600 bg-blue-50/50' : 'text-gray-500 hover:bg-gray-50'}`}
                                >
                                    <PaletteIcon className="w-4 h-4" /> {t.designTab}
                                </button>
                            </div>
                        </header>

                        <div className="p-6 space-y-6">
                            {activeTab === 'content' ? (
                                <>
                                    {/* Personal Info */}
                                    <section className="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                                        <h2 className="flex items-center gap-2 text-lg font-bold text-slate-800 mb-4">
                                            <span className="text-blue-600"><UserIcon /></span> {t.personalInfo}
                                        </h2>

                                        {/* Photo Upload */}
                                        <div className="mb-4 flex items-center gap-3">
                                            <div className="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center overflow-hidden border border-gray-200 shrink-0">
                                                {resume.personal.avatar ? (
                                                    <img src={resume.personal.avatar} className="w-full h-full object-cover" />
                                                ) : (
                                                    <UserIcon className="text-gray-400" />
                                                )}
                                            </div>
                                            <div className="flex-1">
                                                <label className="cursor-pointer inline-flex items-center gap-2 px-3 py-1.5 bg-blue-50 text-blue-600 rounded-md text-sm font-medium hover:bg-blue-100 transition-colors">
                                                    <UploadIcon className="w-3 h-3" /> {t.uploadPhoto}
                                                    <input type="file" accept="image/*" className="hidden" onChange={handleAvatarUpload} />
                                                </label>
                                                {resume.personal.avatar && (
                                                    <button onClick={removeAvatar} className="ml-2 text-xs text-red-400 hover:text-red-500 underline">
                                                        {t.removePhoto}
                                                    </button>
                                                )}
                                            </div>
                                        </div>

                                        <div className="space-y-3">
                                            <InputGroup label={t.labels.fullName} name="fullName" value={resume.personal.fullName} onChange={handlePersonalChange} />
                                            <InputGroup label={t.labels.role} name="role" value={resume.personal.role} onChange={handlePersonalChange} />
                                            <div className="grid grid-cols-2 gap-3">
                                                <InputGroup label={t.labels.email} name="email" value={resume.personal.email} onChange={handlePersonalChange} />
                                                <InputGroup label={t.labels.phone} name="phone" value={resume.personal.phone} onChange={handlePersonalChange} />
                                            </div>
                                            <InputGroup label={t.labels.address} name="address" value={resume.personal.address} onChange={handlePersonalChange} />
                                            <div className="grid grid-cols-2 gap-3">
                                                <InputGroup label={t.labels.linkedin} name="linkedin" value={resume.personal.linkedin} onChange={handlePersonalChange} />
                                                <InputGroup label={t.labels.website} name="website" value={resume.personal.website} onChange={handlePersonalChange} />
                                            </div>
                                            <InputGroup label={t.labels.summary} name="summary" value={resume.personal.summary} onChange={handlePersonalChange} placeholder={t.placeholders.summary} type="textarea" />
                                        </div>
                                    </section>

                                    {/* Languages (Moved here) */}
                                    <div className="mb-6"></div>
                                    <DynamicList
                                        title={t.languages}
                                        items={resume.languages || []}
                                        icon={GlobeIcon}
                                        t={t}
                                        editorSpacingModifier={editorSpacing}
                                        onAdd={() => addToList('languages', { language: '', proficiency: '' })}
                                        onRemove={(id) => removeFromList('languages', id)}
                                        onChange={(id, field, val) => updateListItem('languages', id, field, val)}
                                        onMove={(idx, dir) => moveListItem('languages', idx, dir)}
                                        fields={[
                                            { key: 'language', labelKey: 'language', type: 'text', options: t.languageOptions },
                                            { key: 'proficiency', labelKey: 'proficiency', type: 'text', options: t.proficiencyOptions }
                                        ]}
                                    />

                                    {/* Experience */}
                                    <DynamicList
                                        title={t.experience}
                                        items={resume.experience}
                                        icon={BriefcaseIcon}
                                        t={t}
                                        editorSpacingModifier={editorSpacing}
                                        extraHeader={
                                            <label className="flex items-center gap-2 text-xs text-gray-500 cursor-pointer font-normal">
                                                <span>{t.showTechStack || 'Show Tech Stack'}</span>
                                                <input
                                                    type="checkbox"
                                                    checked={design.showTechnologies !== false}
                                                    onChange={(e) => setDesign(p => ({ ...p, showTechnologies: e.target.checked }))}
                                                    className="w-3.5 h-3.5 accent-blue-600 rounded"
                                                />
                                            </label>
                                        }
                                        onAdd={() => addToList('experience', { role: '', company: '', date: '', location: '', description: '', technologies: '' })}
                                        onRemove={(id) => removeFromList('experience', id)}
                                        onChange={(id, field, val) => updateListItem('experience', id, field, val)}
                                        onMove={(idx, dir) => moveListItem('experience', idx, dir)}
                                        fields={[
                                            { key: 'role', labelKey: 'role' },
                                            { key: 'company', labelKey: 'company' },
                                            { key: 'type', labelKey: 'employmentType', type: 'select', options: t.employmentTypes, placeholderKey: 'employmentType' },
                                            { key: 'date', labelKey: 'date', type: 'text' },
                                            { key: 'location', labelKey: 'location' },
                                            { key: 'technologies', labelKey: 'technologies', placeholderKey: 'technologies', fullWidth: true },
                                            { key: 'description', labelKey: 'description', type: 'textarea', placeholderKey: 'description', fullWidth: true }
                                        ]}
                                    />

                                    {/* Education */}
                                    <DynamicList
                                        title={t.education}
                                        items={resume.education}
                                        icon={GraduationCapIcon}
                                        t={t}
                                        editorSpacingModifier={editorSpacing}
                                        onAdd={() => addToList('education', { degree: '', school: '', date: '', location: '' })}
                                        onRemove={(id) => removeFromList('education', id)}
                                        onChange={(id, field, val) => updateListItem('education', id, field, val)}
                                        onMove={(idx, dir) => moveListItem('education', idx, dir)}
                                        fields={[
                                            { key: 'school', labelKey: 'school' },
                                            { key: 'degree', labelKey: 'degree', type: 'select', options: t.degreeOptions, placeholderKey: 'degree' },
                                            { key: 'date', labelKey: 'date', type: 'text' },
                                            { key: 'location', labelKey: 'location' },
                                            { key: 'description', labelKey: 'description', type: 'textarea', placeholderKey: 'description', fullWidth: true }
                                        ]}
                                    />

                                    {/* Skills */}
                                    <DynamicList
                                        title={t.skills}
                                        items={resume.skills}
                                        icon={RocketIcon}
                                        t={t}
                                        editorSpacingModifier={editorSpacing}
                                        onAdd={() => addToList('skills', { name: '', items: '' })}
                                        onRemove={(id) => removeFromList('skills', id)}
                                        onChange={(id, field, val) => updateListItem('skills', id, field, val)}
                                        onMove={(idx, dir) => moveListItem('skills', idx, dir)}
                                        fields={[
                                            { key: 'name', labelKey: 'name' }, // e.g. "Languages"
                                            { key: 'items', labelKey: 'items' } // e.g. "JS, Python"
                                        ]}
                                    />



                                    {/* Projects */}
                                    <DynamicList
                                        title={t.projects}
                                        items={resume.projects}
                                        icon={LayoutIcon}
                                        t={t}
                                        editorSpacingModifier={editorSpacing}
                                        onAdd={() => addToList('projects', { name: '', description: '', link: '' })}
                                        onRemove={(id) => removeFromList('projects', id)}
                                        onChange={(id, field, val) => updateListItem('projects', id, field, val)}
                                        onMove={(idx, dir) => moveListItem('projects', idx, dir)}
                                        fields={[
                                            { key: 'name', labelKey: 'name' },
                                            { key: 'link', labelKey: 'link' },
                                            { key: 'description', labelKey: 'description', type: 'textarea', fullWidth: true }
                                        ]}
                                    />
                                    <div className="h-10"></div>
                                </>
                            ) : (
                                <div className="space-y-8 animate-fadeIn">

                                                        {Object.keys(t.logoPositions).map(k => (
                                                            <button
                                                                key={k}
                                                                onClick={() => setDesign(p => ({ ...p, logoPosition: k }))}
                                                                className={`px-3 py-2 rounded text-xs border bg-white transition-all ${design.logoPosition === k ? 'border-blue-500 text-blue-600 bg-blue-50' : 'border-gray-200 text-gray-600 hover:border-gray-300'}`}
                                                            >
                                                                {t.logoPositions[k]}
                                                            </button>
                                                        ))}
                                                    </div>

                                                    {/* Size Slider */}
                                                    <div className="mb-3">
                                                        <div className="flex justify-between items-center mb-1">
                                                            <label className="text-xs font-bold uppercase text-gray-400">{t.logoSize}</label>
                                                            <span className="text-xs text-gray-500">{design.logoSize || 48}px</span>
                                                        </div>
                                                        <input
                                                            type="range"
                                                            min="20"
                                                            max="200"
                                                            step="4"
                                                            value={design.logoSize || 48}
                                                            onChange={(e) => setDesign(p => ({ ...p, logoSize: parseInt(e.target.value) }))}
                                                            className="w-full h-1 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600"
                                                        />
                                                    </div>

                                                    {/* Opacity Slider */}
                                                    <div>
                                                        <div className="flex justify-between items-center mb-1">
                                                            <label className="text-xs font-bold uppercase text-gray-400">{t.logoOpacity}</label>
                                                            <span className="text-xs text-gray-500">{design.logoOpacity || 80}%</span>
                                                        </div>
                                                        <input
                                                            type="range"
                                                            min="10"
                                                            max="100"
                                                            step="10"
                                                            value={design.logoOpacity || 80}
                                                            onChange={(e) => setDesign(p => ({ ...p, logoOpacity: parseInt(e.target.value) }))}
                                                            className="w-full h-1 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600"
                                                        />
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </section>

                                    <hr className="border-gray-200" />


                                    {/* 5. Single-page section order */}
                                    <section>
                                        <h3 className="font-bold text-gray-900 mb-4 flex items-center gap-2">
                                            <LayoutIcon className="w-4 h-4 text-indigo-500" /> {lang === 'zh' ? '单页模块顺序' : 'Single-page sections'}
                                        </h3>

                                        <div className="space-y-4">
                                            {design.layout?.map((page, pageIdx) => (
                                                <div key={page.id} className="bg-gray-50 border border-gray-200 rounded-lg p-3">
                                                    <div className="flex justify-between items-center mb-2 pb-2 border-b border-gray-100">
                                                        <span className="text-xs font-bold text-gray-500 uppercase">A4 · {lang === 'zh' ? '唯一页面' : 'Only page'}</span>
                                                        <span className="text-[10px] font-bold text-emerald-600 uppercase">210 × 297 mm</span>
                                                    </div>

                                                    <div className="space-y-2">
                                                        {page.sections.map((section, secIdx) => (
                                                            <div key={section} className={`flex items-center justify-between bg-white px-3 py-2 rounded text-sm shadow-sm border border-gray-100 transition-opacity ${design.hiddenSections?.[section] ? 'opacity-45' : ''}`}>
                                                                <div className="flex items-center gap-2">
                                                                    <span className="text-slate-700 capitalize">
                                                                        {t.labels[section] || section}
                                                                    </span>
                                                                    {['modern', 'minimal', 'professional', 'splitCompact', 'monoLedger'].includes(theme) && (
                                                                        <button
                                                                            onClick={() => toggleSectionPosition(section)}
                                                                            className={`text-[10px] px-1.5 py-0.5 rounded border uppercase font-bold tracking-wider transition-colors ${(design.sectionPositions?.[section] === 'main' || (!design.sectionPositions?.[section] && !['skills', 'education', 'languages', 'contact'].includes(section)))
                                                                                ? 'bg-blue-50 text-blue-600 border-blue-200 hover:bg-blue-100'
                                                                                : 'bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200'
                                                                                }`}
                                                                            title="Toggle Column (Sidebar / Main)"
                                                                        >
                                                                            {(design.sectionPositions?.[section] === 'main' || (!design.sectionPositions?.[section] && !['skills', 'education', 'languages', 'contact'].includes(section))) ? 'MAIN' : 'SIDE'}
                                                                        </button>
                                                                    )}
                                                                </div>
                                                                <div className="flex items-center gap-1">
                                                                    <button
                                                                        onClick={() => toggleSectionVisibility(section)}
                                                                        className={`px-1.5 py-1 text-[9px] font-bold uppercase tracking-wider border transition-colors ${design.hiddenSections?.[section] ? 'text-gray-400 border-gray-200 hover:text-blue-600' : 'text-emerald-700 border-emerald-200 bg-emerald-50 hover:bg-emerald-100'}`}
                                                                        title={lang === 'zh' ? '显示或隐藏模块' : 'Show or hide section'}>
                                                                        {design.hiddenSections?.[section] ? (lang === 'zh' ? '显示' : 'Show') : (lang === 'zh' ? '隐藏' : 'Hide')}
                                                                    </button>
                                                                    <button
                                                                        onClick={() => moveSection(pageIdx, secIdx, -1)}
                                                                        className="p-1 text-gray-300 hover:text-blue-500 disabled:opacity-0"
                                                                        disabled={secIdx === 0}
                                                                        title={lang === 'zh' ? '向上移动' : 'Move up'}
                                                                    >
                                                                        <ArrowUpIcon className="w-3 h-3" />
                                                                    </button>
                                                                    <button
                                                                        onClick={() => moveSection(pageIdx, secIdx, 1)}
                                                                        className="p-1 text-gray-300 hover:text-blue-500 disabled:opacity-0"
                                                                        disabled={secIdx === page.sections.length - 1}
                                                                        title={lang === 'zh' ? '向下移动' : 'Move down'}
                                                                    >
                                                                        <ArrowDownIcon className="w-3 h-3" />
                                                                    </button>
                                                                </div>
                                                            </div>
                                                        ))}
                                                        {page.sections.length === 0 && (
                                                            <div className="text-xs text-center text-gray-400 py-2 border border-dashed border-gray-200 rounded">
                                                                {lang === 'zh' ? '空页面' : 'Empty Page'}
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            ))}

                                            <p className="text-xs text-slate-500 leading-relaxed">
                                                {lang === 'zh' ? '拖动顺序或调整密度来控制单页信息层级。内容超出时会显示红色提醒，但不会创建第二页。' : 'Reorder sections or adjust density to keep the hierarchy on one page. Overflow shows a red warning and never creates page two.'}
                                            </p>
                                        </div>
                                    </section>

                                    <div className="h-4"></div>

                                    {/* Print Tips Alert */}
                                    <div className="p-3 bg-amber-50 rounded-lg border border-amber-200 text-xs text-amber-800 space-y-1.5 leading-normal">
                                        <div className="font-bold flex items-center gap-1.5 leading-none mb-1">
                                            <AlertCircleIcon className="w-3.5 h-3.5 shrink-0" />
                                            {lang === 'zh' ? '完美打印建议' : 'Perfect Print Tips'}
                                        </div>
                                        <ul className="list-disc pl-4 space-y-1 opacity-90">
                                            <li>{lang === 'zh' ? '边距：设置为「无」或「最小」' : 'Margins: Set to "None" or "Minimum"'}</li>
                                            <li>{lang === 'zh' ? '页眉和页脚：必须取消勾选' : 'Headers/Footers: MUST be Unchecked'}</li>
                                            <li>{lang === 'zh' ? '缩放：保持 100% (点对点)' : 'Scale: Keep at 100%'}</li>
                                            <li>{lang === 'zh' ? '背景图形：在「更多设置」中勾选' : 'Background Graphics: Check in "More settings"'}</li>
                                        </ul>
                                    </div>

                                    <div className="h-12"></div>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Right: Preview Area */}
                    {/* Right: Preview Area */}
                    <div className="bg-[#e8ebef] flex-1 relative xl:h-screen xl:overflow-auto print:h-auto print:overflow-visible print:block print:bg-white print:p-0 flex flex-col items-center px-8 py-20 xl:py-8">

                        {/* Floating Export Button */}
                        <div className="absolute top-6 right-8 z-20 print:hidden">
                            <button onClick={printPDF} className="px-6 py-2.5 rounded-full bg-slate-900 hover:bg-black text-white text-sm font-bold shadow-lg flex items-center gap-2 transition-all hover:scale-105 active:scale-95">
                                <PrinterIcon className="w-4 h-4" /> {t.export}
                            </button>
                        </div>

                        {/* Resume Paper */}
                        <div className="resume-preview-frame print:mx-auto relative transition-all duration-300"
                            style={{ width: `${A4_WIDTH_PX * previewScale}px`, height: `${A4_HEIGHT_PX * previewScale}px` }}>
                            <div
                                ref={containerRef}
                                className="resume-preview-transform w-[210mm] h-[297mm] relative"
                                style={{ transform: `scale(${previewScale})`, transformOrigin: 'top left' }}
                            >
                                {renderTheme()}
                            </div>
                        </div>

                        <div className="h-20 print:hidden"></div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <style>
        @media print {
            .print-break-avoid {
                break-inside: avoid;
                page-break-inside: avoid;
            }
        }
    </style>
</body>

</html>
