    <style>
        /* 自定义滚动条 */
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600&family=Oswald:wght@300;400;500;600&display=swap');

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* 核心A4尺寸变量 */
        :root {
            --a4-width: 210mm;
            --a4-height: 297mm;
            --a4-padding: 15mm;
            /* 可打印区域高度 = 297mm - 上下内边距 */
            --a4-content-height: calc(297mm - 30mm);
        }

        /* 页面边界指示器 */
        .page-boundary-indicator {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 2px;
            background: repeating-linear-gradient(90deg,
                    #ef4444 0,
                    #ef4444 10px,
                    transparent 10px,
                    transparent 20px);
            pointer-events: none;
            z-index: 99;
        }

        .page-boundary-indicator::after {
            content: '⚠ Page Break';
            position: absolute;
            right: 8px;
            top: -20px;
            font-size: 10px;
            color: #ef4444;
            background: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: 600;
        }

        /* 溢出警告样式 */
        .content-overflow-warning {
            position: absolute;
            bottom: -32px;
            left: 50%;
            transform: translateX(-50%);
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 4px;
            white-space: nowrap;
            z-index: 10;
        }

        /* The editor is intentionally single-page. Legacy break markers are hidden;
           the live usage meter in the editor owns overflow feedback. */
        .page-boundary-indicator,
        .content-overflow-warning {
            display: none;
        }

        .single-page-sheet {
            width: 210mm;
            height: 297mm;
            min-height: 297mm;
            max-height: 297mm;
            overflow: hidden;
            position: relative;
        }

        .single-page-sheet.is-overflowing {
            outline: 3px solid #ef4444;
            outline-offset: 4px;
        }

        .single-page-status {
            backdrop-filter: blur(10px);
        }

        @media print {
            .resume-preview-transform {
                transform: none !important;
            }

            .resume-preview-frame {
                width: 210mm !important;
                height: 297mm !important;
            }
        }

        /* 打印样式优化 - 确保打印与预览一致 */
        @page {
            size: A4;
            margin: 0;
            /* 移除页面边距，让简历的内边距生效 */
        }

        @media print {

            /* 隐藏所有非简历内容 */
            body>*:not(#root) {
                display: none !important;
            }

            html,
            body {
                background: white !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                height: auto !important;
                overflow: visible !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            #root {
                width: 100% !important;
                height: auto !important;
                overflow: visible !important;
            }

            /* 隐藏侧边栏和其他UI */
            .print\\:hidden {
                display: none !important;
                width: 0 !important;
                height: 0 !important;
                overflow: hidden !important;
                position: absolute !important;
                left: -9999px !important;
            }

            .print\\:block {
                display: block !important;
            }

            .print\\:shadow-none {
                box-shadow: none !important;
            }

            /* 预览区域容器 */
            .bg-gray-200.flex-1 {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
                display: block !important;
                width: 100% !important;
            }

            .print\\:h-auto {
                height: auto !important;
                min-height: auto !important;
            }

            /* 隐藏滚动条 */
            ::-webkit-scrollbar {
                display: none;
            }

            /* 简历页面容器 - 保持210mm宽度、297mm高度确保打印与预览一致 */
            .sheet {
                width: 210mm !important;
                height: 297mm !important;
                min-height: 297mm !important;
                max-height: 297mm !important;
                box-shadow: none !important;
                margin: 0 auto !important;
                page-break-after: always !important;
                break-after: page !important;
                overflow: hidden !important;
            }

            /* 最后一页不需要分页 */
            .sheet:last-child {
                page-break-after: auto !important;
                break-after: auto !important;
            }

            /* 隐藏页面边界指示器 */
            .page-boundary-indicator,
            .content-overflow-warning {
                display: none !important;
            }
        }
    </style>
</head>

        // Helper: Date Picker Component (Year/Month)
        const DatePicker = ({ value, onChange }) => {
            const [isCurrent, setIsCurrent] = useState(false);
            const [start, setStart] = useState('');
            const [end, setEnd] = useState('');

            // Parse initial value
            useEffect(() => {
                const val = value || '';
                if (val.includes('Present') || val.includes('至今')) {
                    setIsCurrent(true);
                    const parts = val.split(/ - /);
                    if (parts[0]) setStart(parts[0]);
                } else if (val.includes(' - ')) {
                    const parts = val.split(' - ');
                    setStart(parts[0] || '');
                    setEnd(parts[1] || '');
                    setIsCurrent(false);
                } else {
                    setStart(val);
                    setIsCurrent(false);
                }
            }, []);

            // Handle changes
            const updateValue = (newStart, newEnd, newIsCurrent) => {
                let val = newStart || '';
                if (newStart && (newEnd || newIsCurrent)) val += ' - ';

                if (newIsCurrent) {
                    val += (window.lang === 'zh' ? '至今' : 'Present');
                } else if (newEnd) {
                    val += newEnd;
                }
                // Emit synthetic event for compatibility
                onChange({ target: { value: val } });
            };

            const handleStartChange = (e) => {
                const val = e.target.value;
                setStart(val);
                updateValue(val, end, isCurrent);
            };

            const handleEndChange = (e) => {
                const val = e.target.value;
                setEnd(val);
                updateValue(start, val, isCurrent);
            };

            const toggleCurrent = (e) => {
                const checked = e.target.checked;
                setIsCurrent(checked);
                updateValue(start, end, checked);
            };

            return (
                <div className="flex gap-2 items-center">
                    <input
                        type="month"
                        value={start}
                        onChange={handleStartChange}
                        className="flex-1 p-2 border border-gray-200 rounded text-sm min-w-0"
                        placeholder="Start"
                    />
                    <span className="text-gray-400 font-bold">-</span>
                    {isCurrent ? (
                        <div className="flex-1 p-2 bg-green-50 text-green-700 border border-green-200 rounded text-sm text-center font-medium cursor-not-allowed select-none">
                            {window.lang === 'zh' ? '至今' : 'Present'}
                        </div>
                    ) : (
                        <input
                            type="month"
                            value={end}
                            onChange={handleEndChange}
                            className="flex-1 p-2 border border-gray-200 rounded text-sm min-w-0"
                            placeholder="End"
                        />
                    )}
                    <div className="flex items-center gap-1 shrink-0">
                        <input
                            type="checkbox"
                            checked={isCurrent}
                            onChange={toggleCurrent}
                            className="w-4 h-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500"
                        />
                        <label className="text-xs text-slate-500 whitespace-nowrap cursor-pointer select-none" onClick={() => toggleCurrent({ target: { checked: !isCurrent } })}>
                            {window.lang === 'zh' ? '至今' : 'Current'}
                        </label>
                    </div>
                </div>
            );
        };

        // --- 主题布局组件 ---

        // Helper: Markdown-like Bullet points rendering
        // Helper: Markdown-like Bold implementation
        const renderTextWithFormatting = (str) => {
            if (!str || typeof str !== 'string') return str;
            const parts = str.split(/(\*\*.*?\*\*)/g);
            return parts.map((part, index) => {
                if (part.startsWith('**') && part.endsWith('**')) {
                    return <strong key={index} className="font-bold">{part.slice(2, -2)}</strong>;
                }
                return part;
            });
        };

        // Helper: Markdown-like Bullet points rendering
        const TextWithBullets = ({ text, className }) => {
            if (!text) return null;
            const lines = text.split('\n');
            return (
                <div className={className}>
                    {lines.map((line, i) => {
                        const trimmed = line.trim();
                        const isBullet = /^([-]\s|[*]\s(?!\*)|•)/.test(trimmed);
                        if (isBullet) {
                            const content = trimmed.replace(/^[-*•]\s*/, '');
                            return (
                                <div key={i} className="flex items-start mb-0.5">
                                    <span className="mr-2">•</span>
                                    <span className="flex-1">{renderTextWithFormatting(content)}</span>
                                </div>
                            );
                        }
                        return (
                            <p key={i} className="mb-0.5 min-h-[1.2em]">
                                {renderTextWithFormatting(line)}
                            </p>
                        );
                    })}
                </div>
            );
        }

        // Draggable Logo Component
        const DraggableLogo = ({ design, onDrag }) => {
            if (!design?.logo) return null;

            const handleMouseDown = (e) => {
                if (!onDrag) return; // Read-only mode or missing handler
                e.preventDefault();
                e.stopPropagation();

                const startX = e.clientX;
                const startY = e.clientY;

                const target = e.currentTarget; // The div container
                const parent = target.closest('.sheet'); // Ensure we are inside a sheet
                if (!parent) return;

                const parentRect = parent.getBoundingClientRect();
                const rect = target.getBoundingClientRect();

                // Start position relative to sheet (px)
                const startLeft = rect.left - parentRect.left;
                const startTop = rect.top - parentRect.top;

                const handleMouseMove = (moveEvent) => {
                    const dx = moveEvent.clientX - startX;
                    const dy = moveEvent.clientY - startY;

                    let newX = startLeft + dx;
                    let newY = startTop + dy;

                    // Convert to percentage of sheet dimensions
                    const percentX = (newX / parentRect.width) * 100;
                    const percentY = (newY / parentRect.height) * 100;

                    onDrag({ x: percentX, y: percentY });
                };

                const handleMouseUp = () => {
                    window.removeEventListener('mousemove', handleMouseMove);
                    window.removeEventListener('mouseup', handleMouseUp);
                };

                window.addEventListener('mousemove', handleMouseMove);
                window.addEventListener('mouseup', handleMouseUp);
            };

            // Style for the container
            const getPositionStyle = () => {
                if (design.logoCoords) {
                    return {
                        left: `${design.logoCoords.x}%`,
                        top: `${design.logoCoords.y}%`,
                        transform: 'none' // Remove centering transforms if custom pos
                    };
                }
                return {};
            };

            const getContainerClasses = () => {
                const base = "absolute z-10 cursor-move print:absolute print:z-0";

                if (design.logoCoords) {
                    return base;
                }

                // Default positioning classes
                const pos = design.logoPosition || 'header-right';
                let classes = base;

                if (pos === 'watermark-center') {
                    classes += ' top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-center opacity-30';
                } else {
                    classes += pos.startsWith('header') ? ' top-[12mm]' : ' bottom-[12mm]';
                    classes += pos.endsWith('left') ? ' left-[15mm]' : ' right-[15mm]';
                }
                return classes;
            };

            return (
                <div
                    className={getContainerClasses()}
                    style={getPositionStyle()}
                    onMouseDown={handleMouseDown}
                >
                    <img
                        src={design.logo}
                        alt="Logo"
                        className="object-contain pointer-events-none"
                        style={{
                            width: `${design.logoSize || 48}px`,
                            height: `${design.logoSize || 48}px`,
                            opacity: (design.logoOpacity || 80) / 100
                        }}
                    />
                </div>
            );
        };

        const DroppableColumn = ({ columnId, onDrop, children, className }) => {

            const handleDragOver = (e) => {

            const handleDragLeave = () => {

                e.preventDefault();
                setIsOver(false);
                const sectionId = e.dataTransfer.getData('sectionId');
                if (sectionId && onDrop) {
                    onDrop(sectionId, columnId);
                }
            };

            return (
                <div
                    onDragOver={handleDragOver}
                    onDragLeave={handleDragLeave}
                    onDrop={handleDrop}
                    className={`${className || ''} ${isOver ? 'ring-2 ring-blue-500 bg-blue-50/10' : ''} transition-all duration-200 min-h-[50px]`}

        };

        // --- Shared Header Component ---
        const ResumeHeader = ({ data, t }) => {
            const { personal, design } = data;
            const layout = design.headerLayout || 'split';
            const style = design.headerStyle || 'clean';
            const avatarShape = design.avatarShape || 'rounded';
            const headerSpacing = design.headerSpacing ?? 1;
            const accentColor = design.color || '#3b82f6';

            // Avatar styling
            const avatarSize = (design.avatarSize || 80) + 'px';
            const imgClass = `object-cover shadow-sm ${
                avatarShape === 'circle' ? 'rounded-full' : 
                avatarShape === 'rounded' ? 'rounded-lg' : 'rounded-none'
            }`;

            // Header Container Style
            const containerStyle = { 
                paddingBottom: `${0.75 * headerSpacing}rem`, 
                marginBottom: `${0.75 * headerSpacing}rem`,
                borderBottom: style === 'modern' ? '2px solid #1f2937' : 'none',
                backgroundColor: style === 'accent' ? `${accentColor}10` : 'transparent',
                padding: style === 'accent' ? '24px' : undefined,
                margin: style === 'accent' ? '-15mm -15mm 24px -15mm' : undefined,
                color: style === 'accent' ? '#1f2937' : 'inherit'
            };

            const nameStyle = { color: accentColor, fontSize: 'calc(var(--heading-size) * 1.8)' };

            let containerClass = "flex gap-8 items-start relative ";
            if (layout === 'center') containerClass += "flex-col items-center text-center";
            else if (layout === 'left') containerClass += "flex-row-reverse justify-end";
            else containerClass += "justify-between"; // split

            return (
                <div className={containerClass} style={containerStyle}>
                    <div className={layout === 'center' ? "w-full" : "flex-1"}>
                        <h1 className="font-bold uppercase tracking-wider mb-1" style={nameStyle}>
                            {personal.fullName}
                        </h1>
                        <p className="text-gray-600 font-medium mb-1" style={{ fontSize: 'var(--subheading-size)' }}>{personal.role}</p>
                        
                        <div className={`flex flex-wrap gap-x-6 gap-y-1 text-gray-500 mb-1 ${layout === 'center' ? "justify-center" : ""}`} style={{ fontSize: 'var(--body-size)' }}>
                            {personal.email && (
                                <span className="flex items-center gap-1">
                                    <MailIcon className="w-3.5 h-3.5" style={{ color: accentColor }} /> {personal.email}
                                </span>
                            )}
                            {personal.phone && (
                                <span className="flex items-center gap-1">
                                    <PhoneIcon className="w-3.5 h-3.5" style={{ color: accentColor }} /> {personal.phone}
                                </span>
                            )}
                            {personal.address && (
                                <span className="flex items-center gap-1">
                                    <MapPinIcon className="w-3.5 h-3.5" style={{ color: accentColor }} /> {personal.address}
                                </span>
                            )}
                        </div>

                        {(personal.linkedin || personal.website) && (
                            <div className={`flex flex-wrap gap-x-6 gap-y-1 text-sm text-gray-500 ${layout === 'center' ? "justify-center" : ""}`}>
                                {personal.linkedin && (
                                    <span className="break-all flex items-center gap-1">
                                        <LinkedinIcon className="w-3.5 h-3.5" style={{ color: accentColor }} /> {personal.linkedin}
                                    </span>
                                )}
                                {personal.website && (
                                    <span className="break-all flex items-center gap-1">
                                        <GlobeIcon className="w-3.5 h-3.5" style={{ color: accentColor }} /> {personal.website}
                                    </span>
                                )}
                            </div>
                        )}
                    </div>
                    {personal.avatar && (
                        <div className="shrink-0">
                            <img src={personal.avatar} alt="Profile" className={imgClass} style={{ width: avatarSize, height: avatarSize }} />
                        </div>
                    )}
                </div>
            );
        };

        // Single-page template family. These layouts share the same compact,
        // print-safe content model while offering three clearly different looks.
        const ThemeSinglePage = ({ data, t, fontStyle, variant = 'swiss' }) => {
            const { personal, experience = [], education = [], projects = [], skills = [], languages = [], design = {} } = data;
            const accent = design.color || (variant === 'splitCompact' ? '#173f68' : '#ef3b2d');
            const density = design.singleDensity || 'balanced';
            const compact = density === 'compact';
            const roomy = density === 'roomy';
            const ratio = Math.max(24, Math.min(42, design.singleColumnRatio || (variant === 'splitCompact' ? 30 : 31)));
            const bodyPx = compact ? 9.2 : roomy ? 10.6 : 10;
            const lineHeight = compact ? 1.24 : roomy ? 1.42 : 1.34;
            const sectionGap = compact ? '8px' : roomy ? '16px' : '12px';
            const paper = design.paperTone === 'warm' ? '#fbf8f1' : design.paperTone === 'cool' ? '#f8fafc' : '#ffffff';
            const pageMargin = Math.max(8, Math.min(18, design.pageMargin || 13));
            const headingStyle = design.sectionHeadingStyle || 'line';
            const showAvatar = design.showAvatar !== false;
            const displayName = /^ZHOUBOWEN$/i.test((personal.fullName || '').replace(/\s/g, '')) ? 'ZHOU BOWEN' : personal.fullName;
            const visibleSections = new Set((design.layout?.[0]?.sections || ['summary', 'experience', 'education', 'projects', 'skills', 'languages']));
            const isVisible = (id) => visibleSections.has(id) && !design.hiddenSections?.[id];

            const SectionTitle = ({ children, light = false }) => {
                const block = headingStyle === 'block';
                const plain = headingStyle === 'plain';
                return (
                    <h2 className="font-bold uppercase tracking-[0.16em] flex items-center gap-2"
                        style={{
                            fontSize: compact ? '9px' : '9.6px',
                            color: block ? (light ? '#102f50' : '#ffffff') : (light ? '#ffffff' : '#111827'),
                            background: block ? (light ? '#ffffff' : accent) : 'transparent',
                            display: 'inline-flex',
                            padding: block ? '4px 7px' : 0,
                            marginBottom: '7px'
                        }}>
                        {!plain && !block && <span style={{ width: '14px', height: '2px', background: light ? 'currentColor' : accent, display: 'inline-block' }}></span>}
                        {children}
                    </h2>
                );
            };

            const ContactLine = ({ light = false, stacked = false }) => (
                <div className={stacked ? 'space-y-1.5' : 'flex flex-wrap items-center gap-x-4 gap-y-1'}
                    style={{ color: light ? 'rgba(255,255,255,.86)' : '#4b5563', fontSize: compact ? '8px' : '8.6px' }}>
                    {personal.email && <span className="flex items-center gap-1"><MailIcon className="w-3 h-3" />{personal.email}</span>}
                    {personal.phone && <span className="flex items-center gap-1"><PhoneIcon className="w-3 h-3" />{personal.phone}</span>}
                    {personal.address && <span className="flex items-center gap-1"><MapPinIcon className="w-3 h-3" />{personal.address}</span>}
                    {personal.linkedin && <span className="flex items-center gap-1 break-all"><LinkedinIcon className="w-3 h-3" />{personal.linkedin}</span>}
                    {personal.website && <span className="flex items-center gap-1 break-all"><GlobeIcon className="w-3 h-3" />{personal.website}</span>}
                </div>
            );

            const ExperienceList = ({ editorial = false, timeline = false }) => (
                <div className="flex flex-col" style={{ gap: compact ? '7px' : '9px' }}>
                    {experience.map((exp, index) => (
                        <article key={exp.id} className="print-break-avoid relative" style={timeline ? { paddingLeft: '15px' } : undefined}>
                            {timeline && <span style={{ position: 'absolute', left: 0, top: '4px', width: '6px', height: '6px', borderRadius: '50%', background: accent }}></span>}
                            <div className="grid items-baseline gap-2" style={{ gridTemplateColumns: editorial ? '1fr auto' : '1fr 82px' }}>
                                <div>
                                    <h3 className="font-bold" style={{ fontSize: compact ? '9.4px' : '10px', color: '#111827' }}>{exp.role}</h3>
                                    <div className="italic" style={{ fontSize: compact ? '7.9px' : '8.4px', color: accent }}>{exp.company}{exp.location ? ` · ${exp.location}` : ''}</div>
                                </div>
                                <time className="font-semibold text-right" style={{ fontSize: compact ? '7.8px' : '8.3px', color: '#4b5563' }}>{exp.date}</time>
                            </div>
                            <TextWithBullets text={exp.description} className="mt-1 text-slate-700 leading-tight" />
                            {design.showTechnologies !== false && exp.technologies && (
                                <p className="mt-1 text-slate-500" style={{ fontSize: compact ? '7.4px' : '8px' }}><strong className="text-slate-700">{t.labels.technologies}:</strong> {exp.technologies}</p>
                            )}
                            {index < experience.length - 1 && editorial && <div className="mt-2 border-b border-black/15"></div>}
                        </article>
                    ))}
                </div>
            );

            const EducationList = ({ light = false }) => (
                <div className="space-y-2">
                    {education.map(edu => (
                        <div key={edu.id} className="print-break-avoid">
                            <div className="font-bold" style={{ fontSize: '8.5px' }}>{edu.degree || edu.school}</div>
                            <div style={{ fontSize: '7.6px', opacity: .82 }}>{edu.school}{edu.location ? ` · ${edu.location}` : ''}</div>
                            <div style={{ fontSize: '7.4px', color: light ? 'rgba(255,255,255,.68)' : '#6b7280' }}>{edu.date}</div>
                        </div>
                    ))}
                </div>
            );

            const SkillsList = ({ light = false }) => (
                <div className="space-y-1.5">
                    {skills.map(skill => skill.name && (
                        <div key={skill.id} className="print-break-avoid" style={{ fontSize: '7.6px' }}>
                            <strong>{skill.name}:</strong> <span style={{ opacity: .82 }}>{skill.items}</span>
                        </div>
                    ))}
                </div>
            );

            const LanguagesList = ({ light = false }) => (
                <div className="flex flex-wrap gap-x-3 gap-y-1" style={{ fontSize: '7.6px' }}>
                    {languages.map(item => item.language && <span key={item.id}><strong>{item.language}</strong> <span style={{ opacity: .72 }}>{item.proficiency}</span></span>)}
                </div>

            const ProjectsList = () => (
                <div className="space-y-1.5">
                    {projects.map(project => project.name && (
                        <div key={project.id} className="print-break-avoid" style={{ fontSize: '7.5px' }}>

                        </div>
                    ))}
                </div>
            );

            const sheetBase = {
                fontFamily: ['monoLedger', 'classicRefresh', 'softEditorialRefresh'].includes(variant) ? "'EB Garamond', serif" : fontStyle,
                fontSize: `${bodyPx}px`,
                lineHeight,
                background: paper,
                color: '#111827'
            };

            if (variant === 'classicRefresh') {
                return (
                    <div className="sheet single-page-sheet shadow-2xl print:shadow-none" style={sheetBase}>
                        <div data-page-content className="h-full relative" style={{ padding: `${pageMargin}mm` }}>

                                <p className="mt-2 uppercase tracking-[0.18em] text-slate-600" style={{ fontFamily: "'Inter', sans-serif", fontSize: '7.8px' }}>{personal.role}</p>
                                <div className="mt-3 flex justify-center" style={{ fontFamily: "'Inter', sans-serif" }}><ContactLine /></div>
                                {showAvatar && personal.avatar && <img src={personal.avatar} alt="Profile" className="absolute right-0 top-0 w-[22mm] h-[25mm] object-cover grayscale" style={{ borderRadius: design.avatarShape === 'circle' ? '999px' : design.avatarShape === 'square' ? 0 : '4px' }} />}
                            </header>
                            {isVisible('summary') && personal.summary && (
                                <section className="py-4 border-b border-slate-300 text-center max-w-[150mm] mx-auto">
                                    <p className="italic text-slate-700" style={{ fontSize: compact ? '9.4px' : '10.2px' }}>{renderTextWithFormatting(personal.summary)}</p>
                                </section>

                            <div className="grid pt-4" style={{ gridTemplateColumns: `1fr ${ratio}%`, gap: '9mm' }}>
                                <main>
                                    {isVisible('experience') && <section style={{ marginBottom: sectionGap }}><SectionTitle>{t.experience}</SectionTitle><ExperienceList editorial /></section>}
                                    {isVisible('projects') && projects.length > 0 && <section><SectionTitle>{t.projects}</SectionTitle><ProjectsList /></section>}
                                </main>
                                <aside className="pl-4 border-l border-slate-300" style={{ fontFamily: "'Inter', sans-serif" }}>
                                    {isVisible('education') && education.length > 0 && <section style={{ marginBottom: sectionGap }}><SectionTitle>{t.education}</SectionTitle><EducationList /></section>}
                                    {isVisible('skills') && skills.length > 0 && <section style={{ marginBottom: sectionGap }}><SectionTitle>{t.skills}</SectionTitle><SkillsList /></section>}
                                    {isVisible('languages') && languages.length > 0 && <section><SectionTitle>{t.languages}</SectionTitle><LanguagesList /></section>}
                                </aside>
                            </div>
                            <div className="absolute bottom-[7mm] left-[13mm] right-[13mm] flex items-center gap-3 uppercase tracking-[0.18em]" style={{ fontFamily: "'Inter', sans-serif", fontSize: '6.6px' }}>
                                <span>CURRICULUM VITAE</span><span className="h-px flex-1 bg-slate-400"></span><span>{new Date().getFullYear()}</span>
                            </div>
                        </div>
                    </div>
                );
            }

            if (variant === 'minimalRefresh') {
                return (
                    <div className="sheet single-page-sheet shadow-2xl print:shadow-none" style={{ ...sheetBase, background: paper }}>
                        <div data-page-content className="h-full relative" style={{ padding: `${pageMargin}mm ${Math.min(22, pageMargin + 5)}mm` }}>
                            <header className="grid items-end gap-7 pb-5" style={{ gridTemplateColumns: '1fr auto' }}>
                                <div>
                                    <span className="block uppercase tracking-[0.28em] text-slate-400 mb-3" style={{ fontSize: '6.8px' }}>PROFILE / {new Date().getFullYear()}</span>
                                    <h1 className="font-light tracking-[-0.055em] leading-[0.88]" style={{ fontSize: '36px' }}>{displayName}</h1>
                                    <p className="mt-3 uppercase tracking-[0.16em]" style={{ color: accent, fontSize: '7.8px' }}>{personal.role}</p>
                                </div>
                                {showAvatar && personal.avatar && <img src={personal.avatar} alt="Profile" className="w-[22mm] h-[26mm] object-cover grayscale" style={{ borderRadius: design.avatarShape === 'circle' ? '999px' : design.avatarShape === 'square' ? 0 : '2px' }} />}
                            </header>
                            <div className="h-px mb-4" style={{ background: accent }}></div>
                            <ContactLine />
                            {isVisible('summary') && personal.summary && (
                                <section className="grid gap-6 py-5 border-b border-slate-200" style={{ gridTemplateColumns: '25mm 1fr' }}>
                                    <SectionTitle>{t.labels.summary}</SectionTitle>
                                    <p className="text-slate-700" style={{ fontSize: compact ? '9.6px' : '10.4px' }}>{renderTextWithFormatting(personal.summary)}</p>
                                </section>
                            )}
                            {isVisible('experience') && <section className="py-5 border-b border-slate-200"><SectionTitle>{t.experience}</SectionTitle><ExperienceList editorial /></section>}
                            {isVisible('projects') && projects.length > 0 && <section className="py-4 border-b border-slate-200"><SectionTitle>{t.projects}</SectionTitle><ProjectsList /></section>}
                            <div className="grid gap-7 pt-4" style={{ gridTemplateColumns: education.length ? '1fr 1fr' : '1fr' }}>
                                {isVisible('education') && education.length > 0 && <section><SectionTitle>{t.education}</SectionTitle><EducationList /></section>}
                                <div>
                                    {isVisible('skills') && skills.length > 0 && <section style={{ marginBottom: sectionGap }}><SectionTitle>{t.skills}</SectionTitle><SkillsList /></section>}
                                    {isVisible('languages') && languages.length > 0 && <section><SectionTitle>{t.languages}</SectionTitle><LanguagesList /></section>}
                                </div>
                            </div>
                            <div className="absolute right-[13mm] bottom-[7mm] w-[28mm] h-[3px]" style={{ background: accent }}></div>
                        </div>
                    </div>
                );
            }

            if (variant === 'softEditorialRefresh') {
                return (
                    <div className="sheet single-page-sheet shadow-2xl print:shadow-none" style={{ ...sheetBase, background: paper === '#ffffff' ? '#fffaf5' : paper }}>
                        <div data-page-content className="h-full relative overflow-hidden" style={{ padding: `${pageMargin}mm` }}>
                            <div className="absolute -right-[28mm] -top-[22mm] w-[72mm] h-[72mm] rounded-full opacity-10" style={{ background: accent }}></div>
                            <header className="relative grid items-end gap-8 pb-5 border-b" style={{ gridTemplateColumns: '1fr auto', borderColor: `${accent}55` }}>
                                <div>
                                    <span className="uppercase tracking-[0.24em]" style={{ color: accent, fontFamily: "'Inter', sans-serif", fontSize: '7px' }}>CURRICULUM VITAE</span>
                                    <h1 className="mt-2 leading-[0.88] tracking-[-0.045em]" style={{ fontSize: '37px', fontWeight: 500 }}>{displayName}</h1>
                                    <p className="mt-3 italic text-slate-600" style={{ fontSize: '10px' }}>{personal.role}</p>
                                    <div className="mt-3 font-sans"><ContactLine /></div>
                                </div>
                                {showAvatar && personal.avatar && (
                                    <div className="relative">
                                        <div className="absolute -inset-2 rounded-full border" style={{ borderColor: `${accent}66` }}></div>
                                        <img src={personal.avatar} alt="Profile" className="relative w-[25mm] h-[25mm] object-cover rounded-full grayscale" />
                                    </div>
                                )}
                            </header>
                            {isVisible('summary') && personal.summary && (
                                <section className="grid gap-6 py-5" style={{ gridTemplateColumns: '8mm 1fr' }}>
                                    <span className="leading-none" style={{ color: accent, fontSize: '28px' }}>“</span>
                                    <p className="italic text-slate-700" style={{ fontSize: compact ? '10px' : '11px' }}>{renderTextWithFormatting(personal.summary)}</p>
                                </section>
                            )}
                            <div className="grid gap-[9mm]" style={{ gridTemplateColumns: `1fr ${ratio}%` }}>
                                <main>
                                    {isVisible('experience') && <section style={{ marginBottom: sectionGap }}><SectionTitle>{t.experience}</SectionTitle><ExperienceList editorial /></section>}
                                    {isVisible('projects') && projects.length > 0 && <section><SectionTitle>{t.projects}</SectionTitle><ProjectsList /></section>}
                                </main>
                                <aside className="p-4" style={{ background: `${accent}0D` }}>
                                    {isVisible('education') && education.length > 0 && <section style={{ marginBottom: sectionGap }}><SectionTitle>{t.education}</SectionTitle><EducationList /></section>}
                                    {isVisible('skills') && skills.length > 0 && <section style={{ marginBottom: sectionGap }}><SectionTitle>{t.skills}</SectionTitle><SkillsList /></section>}
                                    {isVisible('languages') && languages.length > 0 && <section><SectionTitle>{t.languages}</SectionTitle><LanguagesList /></section>}
                                </aside>
                            </div>
                            <div className="absolute bottom-[7mm] left-[13mm] right-[13mm] flex items-center gap-3 uppercase tracking-[0.2em] font-sans" style={{ color: accent, fontSize: '6.4px' }}>
                                <span>PROFILE</span><span className="h-px flex-1" style={{ background: `${accent}55` }}></span><span>ONE PAGE</span>
                            </div>
                        </div>
                    </div>
                );
            }

            if (variant === 'executiveRefresh') {
                const executiveInk = '#12263f';
                return (
                    <div className="sheet single-page-sheet shadow-2xl print:shadow-none" style={sheetBase}>
                        <div data-page-content className="h-full relative">
                            <header className="text-white grid items-center gap-8" style={{ gridTemplateColumns: '1fr auto', background: executiveInk, padding: `${Math.max(9, pageMargin - 2)}mm ${pageMargin}mm` }}>
                                <div>
                                    <div className="w-[12mm] h-[3px] mb-3" style={{ background: accent }}></div>
                                    <h1 className="font-bold uppercase tracking-[-0.035em] leading-none" style={{ fontSize: '31px' }}>{displayName}</h1>
                                    <p className="mt-2 uppercase tracking-[0.16em] text-white/75" style={{ fontSize: '7.8px' }}>{personal.role}</p>
                                    <div className="mt-4"><ContactLine light /></div>
                                </div>
                                {showAvatar && personal.avatar && <img src={personal.avatar} alt="Profile" className="w-[25mm] h-[29mm] object-cover" style={{ borderRadius: design.avatarShape === 'circle' ? '999px' : design.avatarShape === 'square' ? 0 : '5px', border: `2px solid ${accent}` }} />}
                            </header>
                            <div className="grid" style={{ gridTemplateColumns: `1fr ${ratio}%`, padding: `${Math.max(8, pageMargin - 2)}mm ${pageMargin}mm`, gap: '9mm' }}>
                                <main>
                                    {isVisible('summary') && personal.summary && <section style={{ marginBottom: sectionGap }}><SectionTitle>{t.labels.summary}</SectionTitle><p className="text-slate-700 text-justify">{renderTextWithFormatting(personal.summary)}</p></section>}
                                    {isVisible('experience') && <section style={{ marginBottom: sectionGap }}><SectionTitle>{t.experience}</SectionTitle><ExperienceList timeline /></section>}
                                    {isVisible('projects') && projects.length > 0 && <section><SectionTitle>{t.projects}</SectionTitle><ProjectsList /></section>}
                                </main>
                                <aside className="pl-4 border-l-2" style={{ borderColor: accent }}>
                                    <div className="uppercase tracking-[0.16em] font-bold mb-4" style={{ color: executiveInk, fontSize: '7px' }}>EXECUTIVE PROFILE</div>
                                    {isVisible('skills') && skills.length > 0 && <section style={{ marginBottom: sectionGap }}><SectionTitle>{t.skills}</SectionTitle><SkillsList /></section>}
                                    {isVisible('education') && education.length > 0 && <section style={{ marginBottom: sectionGap }}><SectionTitle>{t.education}</SectionTitle><EducationList /></section>}
                                    {isVisible('languages') && languages.length > 0 && <section><SectionTitle>{t.languages}</SectionTitle><LanguagesList /></section>}
                                </aside>
                            </div>
                            <div className="absolute left-0 bottom-0 w-full h-[4mm]" style={{ background: accent }}></div>
                        </div>
                    </div>
                );
            }

            if (variant === 'splitCompact') {
                return (
                    <div className="sheet single-page-sheet bg-white shadow-2xl print:shadow-none" style={sheetBase}>
                        <div data-page-content className="grid h-full" style={{ gridTemplateColumns: `${ratio}% 1fr` }}>
                            <aside className="text-white" style={{ background: '#102f50', padding: `${Math.max(8, pageMargin - 3)}mm` }}>
                                {showAvatar && personal.avatar && <img src={personal.avatar} alt="Profile" className="w-[29mm] h-[34mm] object-cover mb-5" style={{ borderRadius: design.avatarShape === 'circle' ? '999px' : design.avatarShape === 'square' ? 0 : '8px' }} />}
                                <div style={{ width: '18px', height: '3px', background: accent, marginBottom: '12px' }}></div>
                                <div className="mb-5"><SectionTitle light>{t.personalInfo}</SectionTitle><ContactLine light stacked /></div>
                                {isVisible('education') && education.length > 0 && <div style={{ marginBottom: sectionGap }}><SectionTitle light>{t.education}</SectionTitle><EducationList light /></div>}
                                {isVisible('skills') && skills.length > 0 && <div style={{ marginBottom: sectionGap }}><SectionTitle light>{t.skills}</SectionTitle><SkillsList light /></div>}
                                {isVisible('languages') && languages.length > 0 && <div><SectionTitle light>{t.languages}</SectionTitle><LanguagesList light /></div>}
                            </aside>
                            <main className="relative" style={{ padding: `${Math.max(8, pageMargin - 3)}mm` }}>
                                <div className="absolute left-0 top-0 bottom-0 w-[2px]" style={{ background: accent }}></div>
                                <header className="mb-4 pb-3 border-b border-slate-300">
                                    <h1 className="font-bold uppercase tracking-[-0.03em] leading-none" style={{ fontSize: '30px', color: '#102f50', wordSpacing: '0.14em' }}>{displayName}</h1>
                                    <p className="mt-1 uppercase tracking-[0.12em] text-slate-600" style={{ fontSize: '8px' }}>{personal.role}</p>
                                </header>
                                {isVisible('summary') && personal.summary && <section style={{ marginBottom: sectionGap }}><SectionTitle>{t.labels.summary}</SectionTitle><p className="text-slate-700 text-justify">{renderTextWithFormatting(personal.summary)}</p></section>}
                                {isVisible('experience') && <section style={{ marginBottom: sectionGap }}><SectionTitle>{t.experience}</SectionTitle><ExperienceList timeline /></section>}
                                {isVisible('projects') && projects.length > 0 && <section><SectionTitle>{t.projects}</SectionTitle><ProjectsList /></section>}
                            </main>
                        </div>
                    </div>
                );

                    // Added: Education in Main
                    case 'education': return data.education.length > 0 && (

                            <div style={gap(3)}>

                                    <div key={edu.id} className="print-break-avoid relative pl-4 border-l-2 border-slate-100">

                    // Added: Languages in Main
                    case 'languages': return data.languages?.length > 0 && (
                        <div key="languages" style={{ marginBottom: `${3.5 * sectionSpacing}rem` }}>
                            <h2 className="font-bold text-slate-800 uppercase tracking-wider mb-5 flex items-center gap-2" style={{ fontSize: 'var(--heading-size)' }}>

            return (

        };

        // 5. Elegant Theme (Sophisticated, Single Column)
        // Center aligned headers, Serif fonts, very editorial.
        const ThemeElegant = ({ data, t, fontStyle }) => {
            const spacing = data.design?.spacing || 1;
            const headerSpacing = data.design?.headerSpacing ?? 1;
            const sectionSpacing = data.design?.sectionSpacing ?? 1;

            const s = (rem) => ({ marginBottom: `${rem * spacing}rem` });
            const gap = (rem) => ({ display: 'flex', flexDirection: 'column', gap: `${rem * spacing * (data.design?.itemSpacing || 1)}rem` });

            const layout = data.design?.layout || [{ id: 'p1', sections: ['summary', 'experience', 'education', 'skills', 'languages', 'projects'] }];

            const renderSection = (sectionId) => {
                switch (sectionId) {
                    case 'summary': return data.personal.summary && (
                        <div key="summary" className="text-center max-w-2xl mx-auto" style={{ marginBottom: `${2.5 * sectionSpacing}rem` }}>

                    case 'experience': return data.experience.length > 0 && (
                        <div key="experience" style={{ marginBottom: `${3.5 * sectionSpacing}rem` }}>
